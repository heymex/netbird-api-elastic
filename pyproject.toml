[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netbird-api"
version = "0.1.0"
description = "Collect NetBird peers and audit events into Elasticsearch as ECS documents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "elasticsearch>=8.12,<10",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
netbird-api = "netbird_api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
